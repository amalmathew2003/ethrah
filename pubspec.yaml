name: ethrah_app
description: "Ethrah - Where Elegance Meets Tradition. A premium showcase website for ethnic wear and jewelry brand."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2

  # State Management (optional, for future features)
  provider: ^6.0.0

  # Navigation & Routing
  flutter_native_splash: ^2.3.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    # Add more if needed
    # - assets/icons/
    # - assets/banners/

# Notes:
# 1. Run: flutter pub get
# 2. For web: flutter run -d chrome
# 3. Ensure folder structure:
#    assets/images/logo_ethrah.jpeg
# 4. File names are case-sensitive