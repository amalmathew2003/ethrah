name: ethrah_app
description: "Ethrah - Where Elegance Meets Tradition. A premium showcase website for ethnic wear and jewelry brand."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2

  # State Management
  provider: ^6.1.5+1

  # Animations & UI Enhancements
  flutter_animate: ^4.5.2

  # Splash Screen
  flutter_native_splash: ^2.3.0

  # Supabase
  supabase_flutter: ^2.12.2

  # Environment Variables
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env   # ✅ IMPORTANT (fixes your error)

# Notes:
# 1. Run: flutter clean
# 2. Run: flutter pub get
# 3. Run: flutter run -d chrome
# 4. Make sure .env is in root folder (not inside assets/)